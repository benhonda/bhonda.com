version: "3"

# https://taskfile.dev/usage/#output-syntax
output: prefixed

vars:
  AWS_PROFILE: "pharmer"
  # Per-app facts, declared once at the root (references/taskfile.md). `web` = app #1's
  # dir — rename with it.
  # Dev port, pinned (dev-port-pinned): `--strictPort` fails loudly on a busy port instead
  # of drifting to the next one and breaking anything that embeds the URL.
  WEB_DEV_PORT: "3000"

# Exported to every task's process env so app code (the S3 client's
# fromIni()) and check-aws-identity read the same profile the tasks do — one
# fact, declared once here. Note the precedence: an AWS_PROFILE already
# exported in the developer's shell still wins over this (go-task lets the
# real env override `env:`), so the gate reports "$AWS_PROFILE", not the var.
env:
  AWS_PROFILE: "{{.AWS_PROFILE}}"

# No root-level `dotenv:` — every app task carries its own (per-app-dotenv), and a root
# one would reach the test tasks too (tests-see-no-secrets).

# CORE tasks (cross-cutting). Domain-specific operational tasks live with their domain
# and are appended here when you scaffold that domain:
#   - tf* (terraform/terragrunt) → references/terraform.md
#   - db-push (drizzle schema push) → references/db.md
tasks:
  default:
    cmds:
      - task --list-all

  # ---------------------------------------------------------------- AWS identity
  login:
    requires:
      vars: [AWS_PROFILE]
    cmds:
      - aws sso login --profile {{.AWS_PROFILE}}

  check-aws-identity:
    requires:
      vars: [AWS_PROFILE]
    silent: true
    cmds:
      # NOT `aws sts get-caller-identity`: the CLI answers from its own role-cred
      # cache (~/.aws/cli/cache), which stays green until those creds hit their own
      # expiry — the permission set's session duration, 1h by default and up to 12h —
      # even though the SSO token behind them is already dead. In that window the
      # gate says ready while the app's fromIni() and terraform, which read the token
      # itself, are failing. Resolving through fromIni() — the app's own call — means
      # the gate and the app share one code path and can never disagree. In a cloud
      # session (CLAUDE_CODE_REMOTE=true) the profile fetches its own pass, so
      # `task login` is never the fix there. `web` = app #1's dir (rename with
      # it) — where @aws-sdk/credential-providers is installed; drop the `cd` entirely
      # if this repo was flattened to a single standalone app (no subdir).
      # The braces matter: without them a failing `cd` writes to the task's stderr
      # instead of $err, and the fallback branch prints an empty reason.
      - |
        if ! err=$({ cd web && bun -e 'import("@aws-sdk/credential-providers").then(m=>m.fromIni()()).then(()=>{},e=>{console.error(e.message);process.exit(1)})'; } 2>&1 >/dev/null); then
          if [ "${CLAUDE_CODE_REMOTE:-}" = true ]; then
            echo "This cloud session couldn't get an AWS pass for '$AWS_PROFILE': $err"
          else
            case "$err" in
              *[Ee]xpired*|*[Ss][Ss][Oo]*|*[Tt]oken*) echo "Your '$AWS_PROFILE' AWS SSO session has expired. Run 'task login'." ;;
              *) echo "AWS credential check failed: $err" ;;
            esac
          fi
          exit 1
        fi

  # ---------------------------------------------------------------- Per-app tasks
  # Every app task is dir-scoped to its app from app #1 (`web` — rename to the app's real
  # dir). Bare interactive tasks (start/link/pull) are pickers; bare non-interactive ones
  # (install/generate/typecheck/test/build) run every app — `per-app-picker` in
  # references/taskfile.md. Flatten only for a genuinely standalone repo (no subdir, ever):
  # drop `dir:` and the pickers, keep each task's `dotenv:` (it then resolves at the root).
  start:web:
    aliases: [dev:web]
    desc: Start the web app dev server
    dir: web
    dotenv: &web-dotenv        # anchor once, per app — paths resolve relative to this dir:
      - .env
      - .env.vercel
    interactive: true
    cmds:
      - bunx react-router dev --port {{.WEB_DEV_PORT}} --strictPort

  start:   # no `all` case — dev servers run in the foreground, one at a time
    aliases: [dev]
    desc: Start an app's dev server (interactive app picker)
    interactive: true
    silent: true
    cmds:
      - |
        echo "Start which app?"
        select app in web quit; do
          case "$app" in
            web) exec task start:web ;;
            quit) break ;;
            *) echo "invalid" ;;
          esac
        done

  install:web:
    desc: Install the web app's dependencies with Bun
    dir: web
    cmds:
      - bun install {{.CLI_ARGS}}

  install:
    desc: Install every app's dependencies
    cmds:
      - task: install:web

  build:web:
    desc: Build the web app
    dir: web
    dotenv: *web-dotenv
    cmds:
      - bun run build

  build:
    desc: Build every app
    cmds:
      - task: build:web

  # ---------------------------------------------------------------- Codegen pipeline
  # Each generator is guarded, so dropping a subsystem (deleting its script) is a safe
  # no-op — no Taskfile edit. A generator that EXISTS and fails stops the task.
  generate:web:
    desc: Run the web app's code generators
    dir: web
    cmds:
      - |
        for f in app/lib/actions/_core/action-map.generate.ts app/lib/router/generouted-generate-routes.ts app/lib/env/_core/env-map.generate.ts app/lib/db/schema.generate.ts; do
          if [ -f "$f" ]; then bun run "$f" || exit 1; else echo "⚠️  skip $f (not found)"; fi
        done

  generate:
    desc: Run every app's code generators
    cmds:
      - task: generate:web

  typecheck:web:
    desc: Type check the web app (generates first so types reflect fresh codegen)
    dir: web
    deps: [generate:web]
    cmds:
      - bun run typecheck

  typecheck:
    desc: Type check every app
    aliases: [typecheck:all]
    cmds:
      - task: typecheck:web

  # ---------------------------------------------------------------- Tests
  test:web:
    desc: Run the web app's tests (watch/coverage/a path → task test:web -- --watch)
    dir: web
    # Deliberately NO dotenv: tests never see live secrets (tests-see-no-secrets) —
    # bunfig.toml's `env = false` + test-preload.ts back this up.
    deps: [generate:web]
    cmds:
      - bun test {{.CLI_ARGS}}

  test:
    desc: Run every app's tests
    cmds:
      - task: test:web

  # ---------------------------------------------------------------- Vercel
  link:web:
    desc: Link the web app to its Vercel project
    dir: web
    dotenv: *web-dotenv
    interactive: true
    cmds:
      - bunx vercel link

  link:
    desc: Link an app to its Vercel project (interactive app picker)
    interactive: true
    silent: true
    cmds:
      - |
        echo "Link which app?"
        select app in web quit; do
          case "$app" in
            web) exec task link:web ;;
            quit) break ;;
            *) echo "invalid" ;;
          esac
        done

  # The stack's `pull-secrets:web` (SSM → .env.secrets) joins this once the app has secrets
  # and infra keeps them in SSM (`env-vars-from-ssm` in the adpharm-stack terraform reference).
  pull:web:
    desc: Pull the web app's Vercel env vars into .env.vercel
    dir: web
    dotenv: *web-dotenv
    interactive: true
    cmds:
      - bunx vercel env pull .env.vercel

  pull:
    desc: Pull dev env vars (interactive app picker)
    interactive: true
    silent: true
    cmds:
      - |
        echo "Pull which app? (all = every app)"
        select app in web all quit; do
          case "$app" in
            web) exec task pull:web ;;
            all) exec task pull:web ;;
            quit) break ;;
            *) echo "invalid" ;;
          esac
        done

  # ---------------------------------------------------------------- Terraform
  # web/infra predates the adpharm-stack terraform layout (infra/<component>/root.hcl,
  # tf:<component>:* tasks); these drive it as it stands. Shared always runs before ENV.
  tfinit-shared:
    internal: true
    deps: [check-aws-identity]
    dir: web/infra/live/shared
    cmds:
      - terragrunt init {{.CLI_ARGS}}

  tfinit:
    desc: Initialize Terragrunt for shared + ENV (ENV=staging|production, default staging)
    aliases: [tf-init, tf:init]
    deps: [tfinit-shared]
    vars:
      ENV: '{{default "staging" .ENV}}'
    requires:
      vars: [{ name: ENV, enum: [staging, production] }]
    dir: web/infra/live/{{.ENV}}
    cmds:
      - terragrunt init {{.CLI_ARGS}}

  tfplan-shared:
    internal: true
    deps: [check-aws-identity]
    dir: web/infra/live/shared
    cmds:
      - terragrunt plan {{.CLI_ARGS}}

  tfplan:
    desc: Plan shared + ENV (ENV=staging|production, default staging)
    aliases: [tf-plan, tf:plan]
    deps: [tfplan-shared]
    vars:
      ENV: '{{default "staging" .ENV}}'
    requires:
      vars: [{ name: ENV, enum: [staging, production] }]
    dir: web/infra/live/{{.ENV}}
    cmds:
      - terragrunt plan {{.CLI_ARGS}}

  tfapply-shared:
    internal: true
    interactive: true
    deps: [check-aws-identity]
    dir: web/infra/live/shared
    cmds:
      - terragrunt apply {{.CLI_ARGS}}

  tfapply:
    desc: Apply shared + ENV (ENV=staging|production, default staging)
    aliases: [tf-apply, tf:apply]
    interactive: true
    deps: [tfapply-shared]
    vars:
      ENV: '{{default "staging" .ENV}}'
    requires:
      vars: [{ name: ENV, enum: [staging, production] }]
    dir: web/infra/live/{{.ENV}}
    cmds:
      - terragrunt apply {{.CLI_ARGS}}

  # ---------------------------------------------------------------- One-offs (temp)
  # Throwaway scripts STILL run through `task` (so the app's dotenv + AWS_PROFILE load
  # the same as everything else) — but they're quarantined and short-lived. Convention:
  #   1. script file → <app>/scripts/tmp/<slug>.ts, INSIDE the app: Bun resolves imports
  #      (deps, the `~/` alias) from the script file's location, not the task's `dir:`.
  #      `**/scripts/tmp/` MUST be gitignored — a one-off is never committed
  #   2. add a `tmp-<slug>` block below, dated, with a DELETE-AFTER-RUN banner
  #   3. once it has served its purpose: delete the block + the script, then
  #      `task tmp-sweep` to confirm nothing lingers
  tmp-sweep:
    desc: List lingering one-offs (tmp-* tasks + */scripts/tmp/ files) so they can be removed
    aliases: [tmp:sweep]
    silent: true
    cmds:
      - |
        echo "── tmp-* task blocks still in Taskfile.yml ──"
        grep -nE '^  tmp-[a-z0-9-]+:' Taskfile.yml | grep -v 'tmp-sweep:' || echo "  (none — clean)"
        echo "── files in scripts/tmp/ ──"
        find . -path ./node_modules -prune -o -path '*/node_modules' -prune -o -path '*/scripts/tmp/*' -type f ! -name .gitkeep -print | grep . || echo "  (none — clean)"

  # ---- one-off task blocks go below; DELETE each (block + script) once it has run ----
  # tmp-backfill-foo:        # added 2026-01-01 — DELETE AFTER RUN
  #   desc: '[ONE-OFF 2026-01-01] backfill foo, then remove this task + its script'
  #   aliases: [tmp:backfill-foo]
  #   dir: web                        # the app the script lives in (web/scripts/tmp/)
  #   dotenv: *web-dotenv
  #   deps: [check-aws-identity]      # only if it touches AWS
  #   cmds:
  #     - bun run scripts/tmp/backfill-foo.ts {{.CLI_ARGS}}
